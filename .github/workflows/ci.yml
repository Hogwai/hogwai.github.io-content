name: CI

on:
  pull_request:
    branches: [main, master]

jobs:
  detect-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Detect changed Java projects
        id: detect
        run: |
          BASE=${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD=${{ github.sha }}
          CHANGED=$(git diff --name-only "$BASE"..."$HEAD" \
            | grep -E '(pom\.xml|build\.gradle)$' \
            | xargs -I{} dirname {} \
            | sort -u)
          if [ -z "$CHANGED" ]; then
            echo "No Java projects changed."
            echo "projects=" >> $GITHUB_OUTPUT
          else
            echo "Changed projects:"
            echo "$CHANGED"
            echo "projects<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Build and test each project
        if: steps.detect.outputs.projects != ''
        run: |
          FAILURES=0
          while IFS= read -r project; do
            [ -z "$project" ] && continue
            echo "============================================"
            echo "Building: $project"
            echo "============================================"
            if [ -f "$project/pom.xml" ]; then
              if ! mvn -B -f "$project/pom.xml" test; then
                echo "FAILED: $project"
                FAILURES=$((FAILURES + 1))
              fi
            elif [ -f "$project/build.gradle" ] || [ -f "$project/build.gradle.kts" ]; then
              if ! (cd "$project" && chmod +x gradlew 2>/dev/null; ./gradlew test); then
                echo "FAILED: $project"
                FAILURES=$((FAILURES + 1))
              fi
            else
              echo "SKIP: $project (no pom.xml or build.gradle found)"
            fi
            echo ""
          done <<< "${{ steps.detect.outputs.projects }}"

          if [ "$FAILURES" -gt 0 ]; then
            echo "$FAILURES project(s) failed."
            exit 1
          fi
          echo "All projects passed."
