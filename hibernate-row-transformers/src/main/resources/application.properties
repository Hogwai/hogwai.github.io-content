# Testcontainers injects the URL dynamically via @DynamicPropertySource
# These props are for dev/demo profile outside tests
spring.datasource.url=jdbc:postgresql://localhost:5432/hibernate_row_transformers
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Show Hibernate query internals and RowTransformer selection
logging.level.org.hibernate.query.sqm=DEBUG
logging.level.org.hibernate.sql.results=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
