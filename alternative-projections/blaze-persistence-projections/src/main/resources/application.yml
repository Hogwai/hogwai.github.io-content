spring:
  application:
    name: blaze-persistence-projections
  datasource:
    url: jdbc:postgresql://localhost:5432/projections
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  threads:
    virtual:
      enabled: true

server:
  port: 8080
