server.port=8080
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100

spring.application.name=baseline

spring.datasource.url=jdbc:postgresql://localhost:5432/perfdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=perfuser
spring.datasource.password=perfpass

# Pool identique à optimized
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000

# OSIV laissé par défaut (actif)
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false


