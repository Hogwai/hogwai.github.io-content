server.port=8081

spring.application.name=optimized

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Virtual Threads
spring.threads.virtual.enabled=true
server.tomcat.threads.max=200

# HTTP/2 est utilisé nativement par gRPC sur le port 9090
# (pas besoin sur le connecteur REST Tomcat)

# Web (MVC with virtual threads)
spring.web.resources.add-mappings=false

# PostgreSQL (real — start with: docker compose up postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/perfdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=perfuser
spring.datasource.password=perfpass

# HikariCP tuning (replaces HikariCPConfig.java)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=500
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.pool-name=OptimizedPool


spring.jpa.open-in-view=false

# JPA optimizations
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
# Batching supprimé — pas de charge INSERT dans les benchmarks
spring.jpa.properties.hibernate.generate_statistics=true

# Redis (start with: docker compose up redis)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-wait=500ms

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true

# Caffeine (L1) is configured in MultiLevelCache

logging.level.org.springframework=WARN
logging.level.com.hogwai=INFO
